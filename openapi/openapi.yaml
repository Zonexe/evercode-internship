openapi: 3.0.3
info:
  title: Evercode Internship Currency API
  description: API для отслеживания и агрегации цен криптовалют с использованием CoinMarketCap API.
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Локальный сервер разработки

security:
  - BearerAuth: []

paths:
  /status:
    get:
      summary: Проверить статус сервера
      description: Публичный эндпоинт, доступен без токена авторизации.
      security: []
      responses:
        "200":
          description: Сервер работает нормально
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /currencies:
    get:
      summary: Получить список всех валют
      description: Возвращает массив всех валют в реестре.
      responses:
        "200":
          description: Список успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Currency"
        "403":
          $ref: "#/components/responses/403Forbidden"

    post:
      summary: Создать новую валюту
      description: Добавляет новую валюту в систему (по умолчанию isTracked = false).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCurrencyDto"
      responses:
        "201":
          description: Валюта успешно создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "409":
          description: Конфликт — валюта с таким тикером уже существует
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /currencies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Уникальный UUID валюты
        schema:
          type: string
          format: uuid

    get:
      summary: Получить валюту по её ID
      responses:
        "200":
          description: Валюта успешно найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

    put:
      summary: Обновить существующую валюту
      description: Позволяет частично или полностью обновить название (name) или тикер (ticker) валюты.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrencyDto"
      responses:
        "200":
          description: Валюта успешно обновлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "409":
          description: Конфликт — измененный тикер уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Удалить валюту по её ID
      responses:
        "204":
          description: Валюта успешно удалена
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /currencies/{id}/track:
    parameters:
      - name: id
        in: path
        required: true
        description: Уникальный UUID валюты
        schema:
          type: string
          format: uuid
    post:
      summary: Включить отслеживание котировок валюты
      description: Помечает валюту как отслеживаемую (isTracked = true), после чего фоновый планировщик начинает обновлять для нее цены с CoinMarketCap.
      responses:
        "200":
          description: Отслеживание успешно включено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /currencies/{id}/untrack:
    parameters:
      - name: id
        in: path
        required: true
        description: Уникальный UUID валюты
        schema:
          type: string
          format: uuid
    post:
      summary: Отключить отслеживание котировок валюты
      description: Снимает флаг отслеживания (isTracked = false).
      responses:
        "200":
          description: Отслеживание успешно отключено
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

/price:
    get:
      summary: Получить историю цен валюты
      description: Возвращает исторические записи цен для валюты (из SQLite).
      parameters:
        - name: currency
          in: query
          required: true
          description: Тикер запрашиваемой валюты (например, BTC)
          schema:
            type: string
            example: BTC
        - name: limit
          in: query
          required: false
          description: Максимальное количество записей в истории цен
          schema:
            type: integer
            minimum: 1
            example: 50
      responses:
        "200":
          description: Успешное получение истории
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceRecord"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"

  /price/latest:
    get:
      summary: Получить самую актуальную цену валюты
      description: Возвращает самую последнюю синхронизированную из CoinMarketCap цену (сохраненную в БД).
      parameters:
        - name: currency
          in: query
          required: true
          description: Тикер запрашиваемой валюты (например, BTC)
          schema:
            type: string
            example: BTC
      responses:
        "200":
          description: Успешное получение текущей цены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceRecord"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          description: Валюта не найдена или данных о цене еще нет
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Введите ваш API_TOKEN (64 символа)

  schemas:
    Currency:
      type: object
      required:
        - id
        - name
        - ticker
        - isTracked
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: United States Dollar
        ticker:
          type: string
          example: USD
        isTracked:
          type: boolean
          example: true
        lastUpdated:
          type: string
          format: date-time
          nullable: true

    CreateCurrencyDto:
      type: object
      required:
        - name
        - ticker
      properties:
        name:
          type: string
          example: Euro
        ticker:
          type: string
          example: EUR

    UpdateCurrencyDto:
      type: object
      properties:
        name:
          type: string
        ticker:
          type: string

    PriceRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        currencyId:
          type: string
          format: uuid
        price:
          type: string
          example: "65000.50"
        recordedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

  responses:
    400BadRequest:
      description: Невалидные входящие данные
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    403Forbidden:
      description: Ошибка авторизации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    404NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
